<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Visitas DNI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .btn {
      width: 100%;
      padding: 20px;
      margin: 10px 0;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      color: white;
      cursor: pointer;
    }
    .ingreso { background: #22c55e; }
    .salida { background: #f97316; }
    .export { background: #8b5cf6; padding: 15px; font-size: 18px; }

    .card {
      background: rgba(255,255,255,0.1);
      padding: 15px;
      margin: 15px 0;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }
    input, button {
      padding: 12px;
      margin: 8px 0;
      width: 100%;
      border-radius: 8px;
      border: none;
    }
    .scanner {
      background: #000;
      color: #0f0;
      padding: 40px 20px;
      text-align: center;
      border: 3px dashed #0f0;
      margin: 20px 0;
      border-radius: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔹 Control de Visitas</h1>

    <!-- Botones principales -->
    <button class="btn ingreso" onclick="iniciarEscaneo('INGRESO')">🚪 INGRESO</button>
    <button class="btn salida" onclick="iniciarEscaneo('SALIDA')">🚪 SALIDA</button>

    <button class="btn export" onclick="mostrarExportar()">📊 Exportar a Excel</button>

    <h2>Últimas Visitas</h2>
    <div id="listaVisitas"></div>
  </div>

  <!-- Modal Escáner -->
  <div id="modalScanner" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000;">
    <div style="padding:20px; text-align:center; color:white;">
      <h2 id="tituloModal">Escaneando DNI - INGRESO</h2>
      <div class="scanner">
        📷 Apunta el DNI argentino<br>
        <span style="font-size:14px;">(Simulación)</span>
      </div>
      
      <input type="text" id="dniInput" placeholder="Número de DNI" style="font-size:18px; text-align:center;">
      <input type="text" id="nombreInput" placeholder="Nombre y Apellido" style="font-size:18px; text-align:center;">
      
      <button onclick="confirmarEscaneo()" style="background:#22c55e; color:white; padding:15px; font-size:18px; margin-top:20px;">✅ CONFIRMAR INGRESO</button>
      <button onclick="cerrarModal()" style="background:#ef4444; color:white; padding:15px; font-size:18px;">Cancelar</button>
    </div>
  </div>

  <script>
    let visitas = JSON.parse(localStorage.getItem('visitas')) || [];

    function guardarVisitas() {
      localStorage.setItem('visitas', JSON.stringify(visitas));
      mostrarVisitas();
    }

    function mostrarVisitas() {
      const lista = document.getElementById('listaVisitas');
      lista.innerHTML = '';
      
      visitas.slice(0, 10).forEach(v => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <strong>${v.nombre} ${v.apellido}</strong><br>
          DNI: ${v.dni}<br>
          <small>Ingreso: ${v.ingreso}</small>
          ${v.salida ? `<br><small style="color:#22c55e">Salida: ${v.salida}</small>` : '<br><small style="color:#f97316">Dentro del edificio</small>'}
        `;
        lista.appendChild(div);
      });
    }

    function iniciarEscaneo(tipo) {
      document.getElementById('modalScanner').style.display = 'block';
      document.getElementById('tituloModal').textContent = `Escaneando DNI - ${tipo}`;
    }

    function cerrarModal() {
      document.getElementById('modalScanner').style.display = 'none';
    }

    function confirmarEscaneo() {
      const dni = document.getElementById('dniInput').value.trim() || "12345678";
      let nombreCompleto = document.getElementById('nombreInput').value.trim() || "Juan Pérez";
      
      if (!nombreCompleto.includes(" ")) nombreCompleto = "Juan Pérez";
      
      const [apellido, ...nombres] = nombreCompleto.split(" ");
      
      const nuevaVisita = {
        id: Date.now(),
        dni: dni,
        nombre: nombres.join(" ") || "Juan",
        apellido: apellido,
        ingreso: new Date().toLocaleString('es-AR'),
        salida: null
      };
      
      visitas.unshift(nuevaVisita);
      guardarVisitas();
      cerrarModal();
      
      alert(`✅ ${nuevaVisita.nombre} ${nuevaVisita.apellido} registrado correctamente!`);
    }

    function mostrarExportar() {
      if (visitas.length === 0) {
        alert("No hay visitas para exportar");
        return;
      }
      alert("✅ Archivo Excel descargado (simulación)\n\nEn la versión real se guardaría en tu celular.");
      console.log("Exportando visitas:", visitas);
    }

    // Inicializar
    mostrarVisitas();
  </script>
</body>
</html>
